name: Validate standalone skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile scripts and tests
        run: >-
          python -m py_compile
          manuscript-docx-formatting/scripts/*.py
          manuscript-docx-formatting/tests/*.py

      - name: Check package structure
        run: |
          test -f manuscript-docx-formatting/SKILL.md
          test -f manuscript-docx-formatting/agents/openai.yaml
          test -f manuscript-docx-formatting/references/formatting-contract.md
          test -f manuscript-docx-formatting/references/front-matter-contract.md
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' | head -1)"

      - name: Run regression tests
        run: python -m unittest discover -s manuscript-docx-formatting/tests -v
